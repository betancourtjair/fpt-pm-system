# Blueprint de Render — ver PID sección 4.3 (plan de despliegue MVP gratuito).
# En el dashboard de Render: New > Blueprint > selecciona este repositorio.
# Las variables marcadas con "sync: false" se capturan/pegan a mano en el
# dashboard (son secretos: NO viven en este archivo ni en el repo).
services:
  - type: web
    name: fpt-pm-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false   # cadena de conexión de Supabase (Settings → Database)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 3h
      - key: CORS_ORIGIN
        sync: false   # dominio del frontend en Netlify, ej. https://tu-sitio.netlify.app
      - key: RESEND_API_KEY
        sync: false   # Fase 2 (alertas) — key de Resend, "Sending access". Vacío = alertas quedan "fallido", el resto del sistema sigue normal.
      - key: EMAIL_REMITENTE
        # @fpt.com.mx (dominio raíz verificado en Resend) — NUNCA
        # @send.fpt.com.mx, ese subdominio es solo el Return-Path/bounce
        # interno (MX+TXT) y no está verificado como remitente.
        value: "Notificaciones FPT <notificaciones@fpt.com.mx>"
      - key: FRONTEND_URL
        sync: false   # URL pública del frontend en Netlify, ej. https://tu-sitio.netlify.app — se usa en el botón de los correos de alerta
